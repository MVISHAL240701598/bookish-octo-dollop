<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: rgb(245, 245, 245);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .profile-card {
            width: 420px;
            background-color: rgb(255, 255, 255);
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            overflow: hidden;
        }

        header {
            background-color: rgb(76, 174, 79);
            padding: 25px;
        }

        header h2 {
            margin: 0;
            color: rgb(255, 255, 255);
            font-size: 42px;
        }

        p {
            color: rgb(85, 85, 85);
            font-size: 18px;
            padding: 30px 20px;
            line-height: 1.6;
        }

        .button {
            background-color: rgb(76, 174, 79);
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 10px;
            padding: 12px 35px;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .button:hover {
            background-color: rgb(69, 170, 63);
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <header>
            <h2>John Doe</h2>
        </header>

        <p>
            Web Developer at XYZ Company.<br>
            Loves coding and coffee.
        </p>

        <button class="button">Contact</button>

    </div>

</body>
</html>
